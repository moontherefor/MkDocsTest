  <h1>回應式互動</h1>
  <p><p>回應式互動主要是訓練成人如何與語言發展遲緩兒童互動之技巧，它著重兒童自然的生活情境中，成人須學會更多的等候，以讓兒童更多次數的自發性溝通、並立即回應兒童發出的口語或非口語訊息。成人依兒童現有能力所表達出來的溝通或語言，利用技巧加以模仿、示範或是稍加延伸，擴展現有字詞、語句的技巧，達到溝通的功能。它特別適用於語言發展階段尚未達到簡單句，或是溝通意圖非常薄弱之遲緩兒。</p>
